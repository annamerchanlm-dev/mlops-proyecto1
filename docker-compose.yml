name: mlops-proyecto1

x-postgres-healthcheck: &pg-healthcheck
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 20s

services:

  # ---------- API DE DATOS LOCAL (solo desarrollo: --profile dev) ----------
  data-api:
    build: ./data-api
    image: mlops-proyecto1/data-api:latest
    container_name: p1_data_api
    profiles: ["dev"]
    environment:
      MIN_UPDATE_TIME: ${MIN_UPDATE_TIME:-30}
      TZ: America/Bogota
    ports:
      - "8081:80"
    volumes:
      - ./data-api/data:/data:Z
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------- POSTGRES 1: METADATOS DE AIRFLOW ----------
  postgres-airflow:
    image: postgres:16-alpine
    container_name: p1_postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD}
      POSTGRES_DB: airflow
      TZ: America/Bogota
    volumes:
      - pg_airflow:/var/lib/postgresql/data
    healthcheck:
      <<: *pg-healthcheck
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
    restart: unless-stopped

  # ---------- POSTGRES 2: DATOS (raw / processed / train) ----------
  postgres-data:
    image: postgres:16-alpine
    container_name: p1_postgres_data
    environment:
      POSTGRES_USER: ${POSTGRES_DATA_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DATA_PASSWORD}
      POSTGRES_DB: covertype
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD}
      TZ: America/Bogota
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      <<: *pg-healthcheck
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DATA_USER} -d covertype"]
    restart: unless-stopped

  # ---------- ADMINER: interfaz web para Postgres ----------
  adminer:
    image: adminer:latest
    container_name: p1_adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres-data
      ADMINER_DESIGN: pepa-linha
    ports:
      - "8082:8080"
    depends_on:
      postgres-data:
        condition: service_healthy
    restart: unless-stopped

  # ---------- MINIO: almacenamiento de modelos ----------
  minio:
    image: minio/minio:latest
    container_name: p1_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: America/Bogota
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ---------- MINIO-INIT: bucket, políticas y usuarios (corre una vez) ----------
  minio-init:
    image: minio/mc:latest
    container_name: p1_minio_init
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_TRAINER_USER: ${MINIO_TRAINER_USER}
      MINIO_TRAINER_PASSWORD: ${MINIO_TRAINER_PASSWORD}
      MINIO_INFERENCE_USER: ${MINIO_INFERENCE_USER}
      MINIO_INFERENCE_PASSWORD: ${MINIO_INFERENCE_PASSWORD}
    volumes:
      - ./minio/init.sh:/init.sh:ro,Z
      - ./minio/policies:/policies:ro,Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  pg_airflow:
  pg_data:
  minio_data:
