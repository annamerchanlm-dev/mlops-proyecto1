name: mlops-proyecto1

x-postgres-healthcheck: &pg-healthcheck
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 20s

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_AIRFLOW_PASSWORD}@postgres-airflow:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
  AIRFLOW__CORE__PARALLELISM: '4'
  AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Bogota
  AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Bogota
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
  AIRFLOW__WEBSERVER__WORKERS: '2'
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
  AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: '30'
  AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: '30'
  TZ: America/Bogota
  # --- Configuración del proyecto (la lee el DAG) ---
  DATA_API_URL: ${DATA_API_URL}
  GROUP_NUMBER: ${GROUP_NUMBER}
  DAG_SCHEDULE_SECONDS: ${DAG_SCHEDULE_SECONDS}
  COVERTYPE_DB_URL: postgresql+psycopg2://${POSTGRES_DATA_USER}:${POSTGRES_DATA_PASSWORD}@postgres-data:5432/covertype

x-airflow-common: &airflow-common
  build: ./airflow
  image: mlops-proyecto1/airflow:2.10.5
  environment:
    <<: *airflow-env
  volumes:
    - ./airflow/dags:/opt/airflow/dags:Z
    - ./airflow/logs:/opt/airflow/logs:Z
    - ./airflow/plugins:/opt/airflow/plugins:Z
  user: "${AIRFLOW_UID:-50000}:0"

services:

  # ---------- API DE DATOS LOCAL (solo desarrollo: --profile dev) ----------
  data-api:
    build: ./data-api
    image: mlops-proyecto1/data-api:latest
    container_name: p1_data_api
    profiles: ["dev"]
    environment:
      MIN_UPDATE_TIME: ${MIN_UPDATE_TIME:-30}
      TZ: America/Bogota
    ports:
      - "8081:80"
    volumes:
      - ./data-api/data:/data:Z
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------- POSTGRES 1: METADATOS DE AIRFLOW ----------
  postgres-airflow:
    image: postgres:16-alpine
    container_name: p1_postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD}
      POSTGRES_DB: airflow
      TZ: America/Bogota
    volumes:
      - pg_airflow:/var/lib/postgresql/data
    healthcheck:
      <<: *pg-healthcheck
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
    restart: unless-stopped

  # ---------- POSTGRES 2: DATOS (raw / processed / train) ----------
  postgres-data:
    image: postgres:16-alpine
    container_name: p1_postgres_data
    environment:
      POSTGRES_USER: ${POSTGRES_DATA_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DATA_PASSWORD}
      POSTGRES_DB: covertype
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD}
      TZ: America/Bogota
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      <<: *pg-healthcheck
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DATA_USER} -d covertype"]
    restart: unless-stopped

  # ---------- ADMINER: interfaz web para Postgres ----------
  adminer:
    image: adminer:latest
    container_name: p1_adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres-data
      ADMINER_DESIGN: pepa-linha
    ports:
      - "8082:8080"
    depends_on:
      postgres-data:
        condition: service_healthy
    restart: unless-stopped

  # ---------- MINIO: almacenamiento de modelos ----------
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: p1_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: America/Bogota
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ---------- MINIO-INIT: bucket, políticas y usuarios (corre una vez) ----------
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: p1_minio_init
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_TRAINER_USER: ${MINIO_TRAINER_USER}
      MINIO_TRAINER_PASSWORD: ${MINIO_TRAINER_PASSWORD}
      MINIO_INFERENCE_USER: ${MINIO_INFERENCE_USER}
      MINIO_INFERENCE_PASSWORD: ${MINIO_INFERENCE_PASSWORD}
    volumes:
      - ./minio/init.sh:/init.sh:ro,Z
      - ./minio/policies:/policies:ro,Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # ---------- AIRFLOW ----------
  airflow-init:
    <<: *airflow-common
    container_name: p1_airflow_init
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    depends_on:
      postgres-airflow:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: p1_airflow_web
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: p1_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  pg_airflow:
  pg_data:
  minio_data:
